name: Validate integration

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The brands check wants an icon and logo submitted to
          # home-assistant/brands. That is a requirement for listing in the
          # HACS default store, not for installing this as a custom
          # repository, which is how the README tells people to add it.
          # Drop this line if it ever gets submitted upstream.
          ignore: brands

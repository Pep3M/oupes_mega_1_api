name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the backend image
        run: docker build -t oupes-api ./backend

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every module parses
        run: python -m compileall -q backend/app tests tools *.py

      - name: Fail if a device address is hardcoded as a default
        run: |
          # The whole point of the config is that nobody inherits one person's
          # network. A literal fallback address is the way that regresses.
          if grep -rnE 'MEGA_HOST["'\'']?[,:]?\s*["'\'']?[0-9]{1,3}\.[0-9]{1,3}\.' \
               --include='*.py' --include='*.yml' --include='*.yaml' . ; then
            echo "::error::MEGA_HOST must not have a hardcoded address as a default"
            exit 1
          fi
